start_tracking:
  name: Start Tracking
  description: Start a new time entry in Clockify.
  fields:
    project_id:
      name: Project ID
      description: The Clockify project ID. If omitted, uses the project selected in the Project select entity.
      required: false
      example: "60b..."
      selector:
        text:
    description:
      name: Description
      description: Description for the time entry.
      required: false
      example: "Working on feature X"
      selector:
        text:
    billable:
      name: Billable
      description: Whether the entry is billable.
      required: false
      default: false
      selector:
        boolean:
    task_id:
      name: Task ID
      description: The Clockify task ID. If omitted, uses the task selected in the Task select entity.
      required: false
      example: "60c..."
      selector:
        text:

stop_tracking:
  name: Stop Tracking
  description: Stop the currently running time entry.

resume_entry:
  name: Resume Entry
  description: Resume a recent time entry (starts a new entry with the same project, task, description, and tags). If entry_index is omitted, resumes the entry selected in the Recent Entry select entity.
  fields:
    entry_index:
      name: Entry Index
      description: Index of the recent entry to resume (1 = most recent, up to 10). If omitted, uses the Recent Entry select entity.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 10
